run-name: "CI ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"
on:
  push:
    branches:
      - '*'
    tags:
      - '[0-9]+.[0-9]+'
    paths:
      - '.github/workflows/**'
      - 'FiraCode.glyphs'
      - 'requirements.txt'
      - 'script/**'

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Dependencies
      run: ./script/bootstrap_linux.sh
    - if: startsWith(github.ref, 'refs/tags/')
      run: python3 ./script/update_version.py
    - run: ./script/build.sh
    - run: echo "hash=$(git rev-parse --short $GITHUB_SHA)" >> $GITHUB_ENV
    - uses: actions/upload-artifact@v4
      with:
        name: Fira_Code_${{ env.hash }}
        path: distr
    - if: startsWith(github.ref, 'refs/tags/')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: python3 ./script/release.py
